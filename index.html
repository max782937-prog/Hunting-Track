<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092517"><title>Hunting Track</title><style>*{box-sizing:border-box}body{margin:0;background:#05170d;color:#f4f1e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:650px;margin:auto;min-height:100vh;background:linear-gradient(#0a2919,#061a10);padding-bottom:90px}header{padding:20px;border-bottom:1px solid #294934;background:#0a2919f5;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:12px}.mark{color:#d1ad52;font-size:25px}.brand b{letter-spacing:2px;font-size:15px}.brand small{display:block;color:#9ba99e;font-size:11px;margin-top:3px}main{padding:22px 18px}.screen{display:none}.screen.active{display:block}.hero,.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.hero h1{margin:0;font-size:30px}.eyebrow{font-size:10px;letter-spacing:2px;color:#d1ad52;margin:0 0 7px}.muted{color:#9ba99e;margin:4px 0 0}h2{font-size:19px;margin:25px 0 12px}.gold{background:#d1ad52;color:#112518;border:0}.circle{width:48px;height:48px;border-radius:50%;font-size:27px}.small{width:42px;height:42px;font-size:23px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:24px 0}.stat,.card,.group,.entry{background:#102e1f;border:1px solid #294d37;border-radius:15px}.stat{text-align:center;padding:14px 5px}.stat b{display:block;color:#d8b75e;font-size:22px}.stat span{font-size:11px;color:#9ba99e}.group{display:flex;align-items:center;gap:12px;padding:15px;margin:9px 0}.icon{width:40px;height:40px;border-radius:11px;background:#d1ad5220;color:#d1ad52;display:grid;place-items:center}.group small{display:block;color:#9ba99e;margin-top:4px}.arrow{margin-left:auto;color:#d1ad52}button{font:inherit;cursor:pointer}.outline,.primary{width:100%;padding:14px;border-radius:13px;font-weight:700}.outline{background:transparent;color:#d1ad52;border:1px solid #55705c}.primary{background:#d1ad52;color:#102417;border:0}.back{background:none;border:0;color:#d1ad52;font-size:38px;padding:0}.members{display:flex;flex-wrap:wrap;gap:7px}.member{border:1px solid #395942;background:#102e1f;border-radius:99px;padding:7px 10px;font-size:12px}.entry{padding:15px;margin:9px 0}.entrytop{display:flex;justify-content:space-between}.badge{font-size:10px;color:#d8b75e;background:#1c3d29;border-radius:99px;padding:5px 8px}.meta{font-size:13px;color:#adb8af;margin-top:8px}.entry p{font-size:13px;color:#b8c1ba}.empty{padding:20px;text-align:center;color:#9ba99e}form{display:grid;gap:8px}label{font-size:12px;color:#d1ad52;margin-top:8px}input,select,textarea{width:100%;background:#0b2618;color:#f4f1e8;border:1px solid #385942;border-radius:12px;padding:13px;font:inherit}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{padding:12px;border-radius:12px;background:#0b2618;color:#aeb9b0;border:1px solid #385942}.seg button.sel{border-color:#d1ad52;color:#e0c16a;background:#d1ad5215}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(650px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#061a10f5;border-top:1px solid #294934;backdrop-filter:blur(12px);z-index:10}nav button{border:0;background:none;color:#8f9e93;font-size:21px}.activeNav{color:#d1ad52}nav span{display:block;font-size:10px;margin-top:2px}</style></head><body><div class="app"><header><div class="brand"><div class="mark">✦</div><div><b>HUNTING TRACK</b><small>Beobachten · Dokumentieren · Teilen</small></div></div></header><main><section id="home" class="screen active"><div class="hero"><div><p class="eyebrow">MEINE JAGD</p><h1>Hunting Track</h1><p class="muted">Dein digitales Jagdtagebuch.</p></div><button class="gold circle" onclick="newEntry()">＋</button></div><div class="stats"><div class="stat"><b id="ec">0</b><span>Einträge</span></div><div class="stat"><b id="hc">0</b><span>Erlegungen</span></div><div class="stat"><b id="gc">1</b><span>Gruppen</span></div></div><h2>Meine Gruppen</h2><div id="groups"></div><button class="outline" onclick="newGroup()">＋ Neue Gruppe</button><h2>Meine Freunde</h2><div id="friends"></div><button class="outline" onclick="addFriend()">＋ Freund hinzufügen</button></section><section id="group" class="screen"><div class="top"><button class="back" onclick="show('home')">‹</button><h2 id="gtitle">Gruppe</h2><button class="gold circle small" onclick="newEntry()">＋</button></div><div id="members" class="members"></div><h2>Einträge</h2><div id="entries"></div><button class="outline" onclick="addMember()">＋ Freund zur Gruppe hinzufügen</button></section><section id="entry" class="screen"><div class="top"><button class="back" onclick="show('group')">‹</button><h2>Neuer Eintrag</h2></div><form onsubmit="saveEntry(event)"><label>Art des Eintrags</label><div class="seg"><button type="button" id="obs" class="sel" onclick="typeSet('observation')">👁 Beobachtung</button><button type="button" id="har" onclick="typeSet('harvest')">✓ Erlegung</button></div><label>Wildart</label><select id="species"><option>Rotwild</option><option>Rehwild</option><option>Gams</option><option>Sonstiges</option></select><label>Wo gesehen / erlegt?</label><input id="location" required placeholder="z. B. Hochstand 3"><label>Datum</label><input id="date" type="date" required><label>Notizen</label><textarea id="notes" rows="5" placeholder="Weitere Informationen ..."></textarea><button class="primary" type="submit">Eintrag speichern</button></form></section></main><nav><button class="activeNav" onclick="show('home')">⌂<span>Übersicht</span></button><button onclick="newEntry()">＋<span>Eintrag</span></button><button onclick="alert('Diese Version speichert Daten direkt auf diesem Gerät. Echte gemeinsame Gruppen über mehrere Handys brauchen später einen Online-Server.')">ⓘ<span>Info</span></button></nav></div><script>let d=JSON.parse(localStorage.getItem('HT_SINGLE')||'null')||{groups:[{id:1,name:'Meine Jagdgruppe',members:['Ich'],entries:[]}],friends:[],cur:1};let type='observation';const save=()=>localStorage.setItem('HT_SINGLE',JSON.stringify(d));const g=()=>d.groups.find(x=>x.id===d.cur)||d.groups[0];function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='home')home();if(id==='group')groupView()}function home(){let all=d.groups.flatMap(x=>x.entries);ec.textContent=all.length;hc.textContent=all.filter(x=>x.type==='harvest').length;gc.textContent=d.groups.length;groups.innerHTML=d.groups.map(x=>`<div class="group" onclick="openGroup(${x.id})"><div class="icon">♧</div><div><b>${esc(x.name)}</b><small>${x.members.length} Mitglieder · ${x.entries.length} Einträge</small></div><div class="arrow">›</div></div>`).join('');friends.innerHTML=d.friends.length?d.friends.map((x,i)=>`<div class="group"><div class="icon">●</div><div><b>${esc(x)}</b><small>Freund</small></div><button class="outline" style="width:auto;padding:7px 10px;margin-left:auto" onclick="removeFriend(${i})">Entfernen</button></div>`).join(''):'<div class="empty">Noch keine Freunde hinzugefügt.</div>'}function openGroup(id){d.cur=id;save();show('group')}function groupView(){let x=g();gtitle.textContent=x.name;members.innerHTML=x.members.map(m=>`<span class="member">● ${esc(m)}</span>`).join('');entries.innerHTML=x.entries.length?x.entries.map(e=>`<div class="entry"><div class="entrytop"><b>${esc(e.species)}</b><span class="badge">${e.type==='harvest'?'Erlegung':'Beobachtung'}</span></div><div class="meta">📍 ${esc(e.location)} · 📅 ${new Date(e.date+'T00:00:00').toLocaleDateString('de-DE')}</div>${e.notes?`<p>${esc(e.notes)}</p>`:''}<p>von ${esc(e.author)}</p></div>`).join(''):'<div class="empty">Noch keine Einträge.</div>'}function newEntry(){date.value=new Date().toISOString().slice(0,10);location.value='';notes.value='';typeSet('observation');show('entry')}function typeSet(t){type=t;obs.classList.toggle('sel',t==='observation');har.classList.toggle('sel',t==='harvest')}function saveEntry(e){e.preventDefault();g().entries.unshift({type,species:species.value,location:location.value,date:date.value,notes:notes.value,author:'Ich'});save();show('group')}function newGroup(){let n=prompt('Name der Gruppe:');if(!n?.trim())return;let id=Date.now();d.groups.push({id,name:n.trim(),members:['Ich'],entries:[]});d.cur=id;save();home()}function addFriend(){let n=prompt('Name / Benutzername des Freundes:');if(!n?.trim())return;if(!d.friends.includes(n.trim()))d.friends.push(n.trim());save();home()}function removeFriend(i){d.friends.splice(i,1);save();home()}function addMember(){if(!d.friends.length){alert('Füge zuerst einen Freund hinzu.');return}let n=prompt('Welchen Freund möchtest du hinzufügen?\n\n'+d.friends.join('\n'));if(!n?.trim())return;if(d.friends.includes(n.trim())&&!g().members.includes(n.trim()))g().members.push(n.trim());save();groupView()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}home();</script></body></html>
